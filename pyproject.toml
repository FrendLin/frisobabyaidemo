[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frisobabyaidemo"
version = "0.1.0"
description = "Friso large-material AI audit proof of concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools]
packages = ["app", "app.providers"]

[tool.setuptools.package-data]
app = ["static/*", "templates/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
